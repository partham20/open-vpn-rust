[package]
name = "ovpn"
description = "A small portable OpenVPN client (TCP, tls-auth/tls-crypt, user/pass), aimed at Windows"
version = "0.1.0"
edition = "2021"
license = "BSD-3-Clause"

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
anyhow = "1"
cbc = { version = "0.1", features = ["std"] }
chacha20poly1305 = "0.10"
clap = { version = "4", features = ["derive"] }
ctr = "0.9"
hex = "0.4"
hmac = "0.12"
lz4_flex = { version = "0.11", default-features = false, features = ["std", "safe-decode"] }
md-5 = "0.10"
rand = "0.8"
rpassword = "7"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
rustls-pki-types = { version = "1", features = ["std"] }
rustls-webpki = { version = "0.103", default-features = false, features = ["ring", "std"] }
sha1 = "0.10"
sha2 = "0.10"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
x509-parser = "0.16"

[target.'cfg(target_os = "linux")'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
wintun = "0.5"
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Networking_WinSock", "Win32_System_Console", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
